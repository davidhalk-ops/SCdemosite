<meta charset="UTF-8">

<title>True North — Powered by Wingify Commerce</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700;900&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --red: #C8102E;
    --red-dark: #9B0B22;
    --red-light: #F5E6E9;
    --white: #FAFAF8;
    --cream: #F4F1EA;
    --black: #1A1A18;
    --gray: #6B6B68;
    --gray-light: #E8E5DC;
    --gold: #C5A028;
    --gold-light: #F7EDD0;
    --pine: #2D5016;
    --pine-light: #EAF0E1;
    --font-display: 'Playfair Display', Georgia, serif;
    --font-body: 'DM Sans', sans-serif;
    --nav-h: 68px;
    --shadow: 0 2px 16px rgba(26,26,24,0.10);
    --shadow-lg: 0 8px 40px rgba(26,26,24,0.14);
    --radius: 4px;
    --radius-lg: 10px;
  }

  body { font-family: var(--font-body); background: var(--white); color: var(--black); line-height: 1.6; }
  a { text-decoration: none; color: inherit; }
  button { cursor: pointer; font-family: var(--font-body); border: none; }
  img { display: block; max-width: 100%; }

  /* ====== LAYOUT ====== */
  .page { min-height: 100vh; display: flex; flex-direction: column; }
  .container { max-width: 1200px; margin: 0 auto; padding: 0 24px; }

  /* ====== NAV ====== */
  nav {
    position: sticky; top: 0; z-index: 100;
    background: var(--white);
    border-bottom: 1.5px solid var(--gray-light);
    height: var(--nav-h);
  }
  .nav-inner {
    max-width: 1200px; margin: 0 auto; padding: 0 24px;
    height: 100%; display: flex; align-items: center; gap: 32px;
  }
  .nav-logo {
    display: flex; align-items: center; gap: 10px;
    font-family: var(--font-display); font-size: 22px; font-weight: 900;
    color: var(--black); letter-spacing: -0.5px;
  }
  .nav-logo .leaf { color: var(--red); font-size: 20px; }
  .nav-links { display: flex; gap: 4px; flex: 1; }
  .nav-links a {
    padding: 6px 14px; border-radius: var(--radius);
    font-size: 14px; font-weight: 500; color: var(--gray);
    transition: color 0.15s, background 0.15s;
  }
  .nav-links a:hover, .nav-links a.active { color: var(--black); background: var(--cream); }
  .nav-right { display: flex; align-items: center; gap: 8px; margin-left: auto; }
  .nav-search {
    display: flex; align-items: center; gap: 8px;
    background: var(--cream); border: 1px solid var(--gray-light);
    border-radius: 20px; padding: 7px 16px; font-size: 13px; color: var(--gray);
    width: 200px;
  }
  .nav-icon {
    width: 38px; height: 38px; border-radius: 50%;
    background: transparent; display: flex; align-items: center; justify-content: center;
    font-size: 18px; color: var(--gray); transition: background 0.15s;
  }
  .nav-icon:hover { background: var(--cream); }
  .cart-badge {
    position: relative;
  }
  .cart-badge .badge {
    position: absolute; top: 4px; right: 4px;
    background: var(--red); color: white; border-radius: 50%;
    width: 16px; height: 16px; font-size: 10px; font-weight: 700;
    display: flex; align-items: center; justify-content: center;
  }

  /* ====== ANNOUNCEMENT BAR ====== */
  .announcement {
    background: var(--red); color: white;
    text-align: center; padding: 9px 24px;
    font-size: 13px; font-weight: 500; letter-spacing: 0.3px;
  }
  .announcement strong { font-weight: 700; }

  /* ====== HERO ====== */
  .hero {
    background: var(--black);
    min-height: 520px;
    display: grid; grid-template-columns: 1fr 1fr;
    overflow: hidden; position: relative;
  }
  .hero-content {
    padding: 80px 64px 80px 48px;
    display: flex; flex-direction: column; justify-content: center;
    position: relative; z-index: 2;
  }
  .hero-badge {
    display: inline-flex; align-items: center; gap: 6px;
    background: rgba(200,16,46,0.2); border: 1px solid rgba(200,16,46,0.4);
    color: #FF6B7A; border-radius: 20px; padding: 5px 14px;
    font-size: 12px; font-weight: 600; letter-spacing: 0.8px; text-transform: uppercase;
    width: fit-content; margin-bottom: 24px;
  }
  .hero h1 {
    font-family: var(--font-display); font-size: 58px; font-weight: 900;
    color: white; line-height: 1.05; margin-bottom: 20px; letter-spacing: -1px;
  }
  .hero h1 em { color: var(--red); font-style: normal; }
  .hero p { color: rgba(255,255,255,0.65); font-size: 16px; line-height: 1.7; margin-bottom: 36px; max-width: 380px; }
  .hero-ctas { display: flex; gap: 12px; align-items: center; }
  .btn-primary {
    background: var(--red); color: white; padding: 14px 28px;
    border-radius: var(--radius); font-size: 15px; font-weight: 600;
    transition: background 0.15s, transform 0.1s;
  }
  .btn-primary:hover { background: var(--red-dark); transform: translateY(-1px); }
  .btn-outline {
    background: transparent; color: white; padding: 14px 28px;
    border: 1.5px solid rgba(255,255,255,0.3); border-radius: var(--radius);
    font-size: 15px; font-weight: 500; transition: border-color 0.15s, background 0.15s;
  }
  .btn-outline:hover { border-color: white; background: rgba(255,255,255,0.06); }
  .hero-visual {
    position: relative; overflow: hidden;
    background: linear-gradient(135deg, #2a0a10 0%, #1A1A18 50%, #0f1f0a 100%);
  }
  .hero-pattern {
    position: absolute; inset: 0;
    background-image: radial-gradient(circle at 70% 50%, rgba(200,16,46,0.15) 0%, transparent 60%);
  }
  .hero-maple {
    position: absolute; right: -20px; top: 50%;
    transform: translateY(-50%);
    font-size: 280px; opacity: 0.07; line-height: 1;
    pointer-events: none; user-select: none;
  }
  .hero-product-showcase {
    position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
  }
  .product-float {
    background: rgba(255,255,255,0.05); backdrop-filter: blur(8px);
    border: 1px solid rgba(255,255,255,0.1); border-radius: var(--radius-lg);
    padding: 20px; text-align: center; color: white;
    display: flex; flex-direction: column; gap: 12px;
  }
  .product-float-emoji { font-size: 80px; }
  .product-float-name { font-size: 14px; font-weight: 600; }
  .product-float-price { font-size: 20px; font-weight: 700; color: var(--red); }

  /* ====== PROMO BANNERS ====== */
  .promo-grid {
    display: grid; grid-template-columns: 1fr 1fr 1fr;
    gap: 16px; padding: 48px 0;
  }
  .promo-card {
    border-radius: var(--radius-lg); overflow: hidden;
    position: relative; padding: 36px 28px;
    min-height: 200px; display: flex; flex-direction: column; justify-content: flex-end;
    cursor: pointer; transition: transform 0.2s, box-shadow 0.2s;
  }
  .promo-card:hover { transform: translateY(-3px); box-shadow: var(--shadow-lg); }
  .promo-card.wide { grid-column: span 2; }
  .promo-card-tag {
    font-size: 11px; font-weight: 700; letter-spacing: 1.2px; text-transform: uppercase;
    margin-bottom: 8px; opacity: 0.85;
  }
  .promo-card h3 { font-family: var(--font-display); font-size: 26px; font-weight: 700; line-height: 1.2; margin-bottom: 12px; }
  .promo-link {
    font-size: 13px; font-weight: 600; display: inline-flex; align-items: center; gap: 6px;
  }
  .promo-link::after { content: '→'; }
  .promo-bg-1 { background: linear-gradient(135deg, #1a0408 0%, #3d0c16 100%); color: white; }
  .promo-bg-2 { background: linear-gradient(135deg, #0f1f0a 0%, #2D5016 100%); color: white; }
  .promo-bg-3 { background: var(--gold-light); color: var(--black); }
  .promo-deco { position: absolute; right: 20px; top: 50%; transform: translateY(-50%); font-size: 90px; opacity: 0.15; pointer-events: none; }

  /* ====== SECTION HEADERS ====== */
  .section-header { display: flex; align-items: flex-end; justify-content: space-between; margin-bottom: 32px; }
  .section-header h2 { font-family: var(--font-display); font-size: 34px; font-weight: 700; line-height: 1.1; }
  .section-header h2 span { color: var(--red); }
  .see-all {
    font-size: 13px; font-weight: 600; color: var(--red);
    display: inline-flex; align-items: center; gap: 4px;
    transition: gap 0.15s;
  }
  .see-all:hover { gap: 8px; }
  .see-all::after { content: '→'; }

  /* ====== AB TASTY BADGE ====== */
  .abt-badge {
    display: inline-flex; align-items: center; gap: 6px;
    background: #F0EEFF; border: 1px solid #C4BAF5;
    color: #4B3FC8; border-radius: 20px; padding: 4px 12px;
    font-size: 11px; font-weight: 600; letter-spacing: 0.3px;
    margin-bottom: 10px;
  }
  .abt-badge .dot { width: 6px; height: 6px; background: #7C6FF0; border-radius: 50%; }

  /* ====== PRODUCT GRID ====== */
  .product-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 24px; }
  .product-card {
    cursor: pointer; transition: transform 0.2s;
  }
  .product-card:hover { transform: translateY(-4px); }
  .product-card:hover .product-thumb { box-shadow: var(--shadow-lg); }
  .product-thumb {
    background: var(--cream); border-radius: var(--radius-lg);
    aspect-ratio: 1; display: flex; align-items: center; justify-content: center;
    font-size: 64px; margin-bottom: 14px; position: relative; overflow: hidden;
    transition: box-shadow 0.2s;
  }
  .product-thumb-bg {
    position: absolute; inset: 0;
    transition: opacity 0.2s;
  }
  .product-badge-sale {
    position: absolute; top: 10px; left: 10px;
    background: var(--red); color: white; border-radius: 3px;
    font-size: 11px; font-weight: 700; padding: 3px 8px; letter-spacing: 0.3px;
  }
  .product-badge-new {
    position: absolute; top: 10px; left: 10px;
    background: var(--pine); color: white; border-radius: 3px;
    font-size: 11px; font-weight: 700; padding: 3px 8px; letter-spacing: 0.3px;
  }
  .product-info { padding: 0 2px; }
  .product-name { font-size: 14px; font-weight: 600; margin-bottom: 4px; line-height: 1.3; }
  .product-sub { font-size: 12px; color: var(--gray); margin-bottom: 8px; }
  .product-price-row { display: flex; align-items: center; gap: 8px; }
  .product-price { font-size: 15px; font-weight: 700; }
  .product-price-old { font-size: 13px; color: var(--gray); text-decoration: line-through; }
  .product-stars { display: flex; gap: 1px; margin-bottom: 4px; }
  .star { color: var(--gold); font-size: 12px; }
  .star.empty { color: var(--gray-light); }

  /* ====== SECTION ====== */
  .section { padding: 56px 0; }
  .section.alt { background: var(--cream); }

  /* ====== COLLECTION CARDS ====== */
  .collection-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; }
  .coll-card {
    border-radius: var(--radius-lg); overflow: hidden; cursor: pointer;
    border: 1.5px solid var(--gray-light); transition: box-shadow 0.2s, transform 0.2s;
  }
  .coll-card:hover { box-shadow: var(--shadow); transform: translateY(-2px); }
  .coll-thumb {
    background: var(--cream); height: 180px;
    display: flex; align-items: center; justify-content: center; font-size: 72px;
    position: relative;
  }
  .coll-info { padding: 20px; }
  .coll-info h3 { font-family: var(--font-display); font-size: 20px; font-weight: 700; margin-bottom: 4px; }
  .coll-info p { font-size: 13px; color: var(--gray); margin-bottom: 14px; }
  .coll-count {
    font-size: 12px; font-weight: 600; color: var(--red);
    display: inline-flex; align-items: center; gap: 4px;
  }
  .coll-count::after { content: '→'; }

  /* ====== FOOTER ====== */
  footer {
    background: var(--black); color: rgba(255,255,255,0.6);
    padding: 48px 0 24px;
  }
  .footer-inner {
    max-width: 1200px; margin: 0 auto; padding: 0 24px;
    display: grid; grid-template-columns: 2fr 1fr 1fr 1fr; gap: 40px;
    margin-bottom: 40px;
  }
  .footer-brand h4 { font-family: var(--font-display); color: white; font-size: 20px; font-weight: 900; margin-bottom: 12px; }
  .footer-brand p { font-size: 13px; line-height: 1.7; max-width: 260px; }
  .footer-col h5 { color: white; font-size: 13px; font-weight: 600; margin-bottom: 14px; letter-spacing: 0.5px; text-transform: uppercase; }
  .footer-col a { display: block; font-size: 13px; margin-bottom: 8px; transition: color 0.15s; }
  .footer-col a:hover { color: white; }
  .footer-bottom {
    max-width: 1200px; margin: 0 auto; padding: 20px 24px 0;
    border-top: 1px solid rgba(255,255,255,0.08);
    display: flex; justify-content: space-between; align-items: center;
  }
  .footer-bottom p { font-size: 12px; }
  .abt-powered {
    display: flex; align-items: center; gap: 8px;
    font-size: 12px; font-weight: 500; color: rgba(255,255,255,0.5);
  }
  .abt-powered strong { color: #7C6FF0; }

  /* ====== PDP ====== */
  .pdp-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 60px; padding: 48px 0; }
  .pdp-gallery { display: flex; flex-direction: column; gap: 12px; }
  .pdp-main-img {
    background: var(--cream); border-radius: var(--radius-lg);
    aspect-ratio: 1; display: flex; align-items: center; justify-content: center;
    font-size: 140px; position: relative;
  }
  .pdp-thumbs { display: flex; gap: 10px; }
  .pdp-thumb {
    background: var(--cream); border-radius: var(--radius);
    width: 72px; height: 72px; display: flex; align-items: center; justify-content: center;
    font-size: 28px; cursor: pointer; border: 2px solid transparent; transition: border-color 0.15s;
  }
  .pdp-thumb.active { border-color: var(--red); }
  .pdp-info h1 { font-family: var(--font-display); font-size: 36px; font-weight: 700; line-height: 1.15; margin-bottom: 10px; }
  .pdp-meta { display: flex; align-items: center; gap: 14px; margin-bottom: 20px; }
  .pdp-price { font-size: 28px; font-weight: 700; color: var(--red); }
  .pdp-price-old { font-size: 18px; color: var(--gray); text-decoration: line-through; }
  .pdp-desc { font-size: 15px; color: var(--gray); line-height: 1.8; margin-bottom: 28px; }
  .pdp-options-label { font-size: 13px; font-weight: 600; color: var(--gray); text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 10px; }
  .pdp-sizes { display: flex; gap: 8px; margin-bottom: 24px; flex-wrap: wrap; }
  .size-btn {
    padding: 8px 16px; border-radius: var(--radius);
    border: 1.5px solid var(--gray-light); background: white;
    font-size: 13px; font-weight: 600; cursor: pointer; transition: all 0.12s;
  }
  .size-btn:hover { border-color: var(--black); }
  .size-btn.active { background: var(--black); color: white; border-color: var(--black); }
  .size-btn.disabled { opacity: 0.35; cursor: not-allowed; }
  .pdp-colors { display: flex; gap: 10px; margin-bottom: 28px; }
  .color-swatch {
    width: 32px; height: 32px; border-radius: 50%; cursor: pointer;
    border: 2px solid transparent; outline: 2px solid transparent;
    transition: outline-color 0.15s; position: relative;
  }
  .color-swatch.active { outline-color: var(--black); outline-offset: 2px; }
  .pdp-qty { display: flex; align-items: center; gap: 12px; margin-bottom: 24px; }
  .qty-btn {
    width: 36px; height: 36px; border-radius: var(--radius);
    border: 1.5px solid var(--gray-light); background: white;
    font-size: 18px; font-weight: 300; display: flex; align-items: center; justify-content: center;
    cursor: pointer; transition: background 0.12s;
  }
  .qty-btn:hover { background: var(--cream); }
  .qty-val { font-size: 16px; font-weight: 600; min-width: 24px; text-align: center; }
  .pdp-add {
    width: 100%; padding: 16px; background: var(--red); color: white;
    border-radius: var(--radius); font-size: 16px; font-weight: 600; margin-bottom: 12px;
    transition: background 0.15s;
  }
  .pdp-add:hover { background: var(--red-dark); }
  .pdp-wishlist {
    width: 100%; padding: 14px; background: transparent; color: var(--black);
    border: 1.5px solid var(--gray-light); border-radius: var(--radius);
    font-size: 15px; font-weight: 500; transition: background 0.15s;
  }
  .pdp-wishlist:hover { background: var(--cream); }
  .pdp-features { margin-top: 28px; border-top: 1px solid var(--gray-light); padding-top: 24px; }
  .pdp-feature { display: flex; align-items: center; gap: 12px; padding: 10px 0; border-bottom: 1px solid var(--gray-light); font-size: 14px; }
  .pdp-feature span:first-child { font-size: 18px; }

  /* ====== CHECKOUT ====== */
  .checkout-grid { display: grid; grid-template-columns: 1fr 420px; gap: 48px; padding: 48px 0; }
  .checkout-form h2 { font-family: var(--font-display); font-size: 28px; font-weight: 700; margin-bottom: 28px; }
  .form-section { margin-bottom: 32px; }
  .form-section h3 { font-size: 14px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.8px; color: var(--gray); margin-bottom: 18px; padding-bottom: 10px; border-bottom: 1px solid var(--gray-light); }
  .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; margin-bottom: 14px; }
  .form-row.single { grid-template-columns: 1fr; }
  .form-group { display: flex; flex-direction: column; gap: 6px; }
  .form-group label { font-size: 12px; font-weight: 600; color: var(--gray); text-transform: uppercase; letter-spacing: 0.5px; }
  .form-group input, .form-group select {
    padding: 11px 14px; border: 1.5px solid var(--gray-light);
    border-radius: var(--radius); font-size: 14px; font-family: var(--font-body);
    background: white; color: var(--black); transition: border-color 0.15s;
  }
  .form-group input:focus, .form-group select:focus { outline: none; border-color: var(--red); }
  .order-summary {
    background: var(--cream); border-radius: var(--radius-lg);
    padding: 28px; position: sticky; top: calc(var(--nav-h) + 24px);
    height: fit-content;
  }
  .order-summary h3 { font-family: var(--font-display); font-size: 22px; font-weight: 700; margin-bottom: 24px; }
  .order-item { display: flex; align-items: center; gap: 14px; margin-bottom: 16px; padding-bottom: 16px; border-bottom: 1px solid var(--gray-light); }
  .order-item-img { width: 60px; height: 60px; background: white; border-radius: var(--radius); display: flex; align-items: center; justify-content: center; font-size: 28px; flex-shrink: 0; }
  .order-item-name { font-size: 14px; font-weight: 600; flex: 1; }
  .order-item-sub { font-size: 12px; color: var(--gray); }
  .order-item-price { font-size: 14px; font-weight: 700; }
  .order-totals { margin-top: 16px; }
  .total-row { display: flex; justify-content: space-between; padding: 6px 0; font-size: 14px; color: var(--gray); }
  .total-row.grand { border-top: 1.5px solid var(--gray-light); margin-top: 12px; padding-top: 14px; font-size: 18px; font-weight: 700; color: var(--black); }
  .checkout-btn {
    width: 100%; padding: 16px; background: var(--red); color: white;
    border-radius: var(--radius); font-size: 16px; font-weight: 700; margin-top: 20px;
    cursor: pointer; border: none; transition: background 0.15s;
    font-family: var(--font-body);
  }
  .checkout-btn:hover { background: var(--red-dark); }
  .secure-badge { display: flex; align-items: center; justify-content: center; gap: 6px; margin-top: 12px; font-size: 12px; color: var(--gray); }

  /* ====== COLLECTION PAGE ====== */
  .collection-header {
    background: var(--black); padding: 60px 0; color: white;
    text-align: center;
  }
  .collection-header h1 { font-family: var(--font-display); font-size: 48px; font-weight: 900; margin-bottom: 12px; }
  .collection-header p { font-size: 16px; color: rgba(255,255,255,0.6); }
  .filter-bar {
    display: flex; align-items: center; gap: 12px;
    padding: 20px 0; border-bottom: 1px solid var(--gray-light); margin-bottom: 32px;
  }

let ABTASTY_RECO_URL = 'https://uc-info.eu.abtasty.com/v1/reco/1120/recos/2de4a962-5c54-4129-9fe7-28edd06a2141';
let ABTASTY_RECO_TOKEN = '';

// Generic skeleton-loading reco carousel — tries the API if recoUrl is provided, falls back to static products
async function fetchRecoGrid(gridId, excludeId, recoUrl) {
  const grid = document.getElementById(gridId);
  if (!grid) return;
  try {
    if (recoUrl) {
      const res = await fetch(recoUrl, { headers: { authorization: ABTASTY_RECO_TOKEN } });
      if (res.ok) {
        const data = await res.json();
        // Only render API items when full product fields are present (catalog indexed)
        if (data.items && data.items.length && data.items[0].img_link) {
          grid.innerHTML = data.items.map(p => buildApiProductCard(p)).join('');
          return;
        }
      }
    }
  } catch(e) {}
  // Fallback: static products, excluding current item
  const fallback = PRODUCTS.filter(p => p.id !== excludeId).slice(0, 4);
  grid.innerHTML = fallback.map(p => buildProductCard(p)).join('');
}

function fetchTrendingProducts() { return fetchRecoGrid('trending-grid', undefined, ABTASTY_RECO_URL); }

function getCarouselTitle(key) {
  return (THEME_CONTENT[currentTheme]?.carouselTitles?.[key]) || 'Recommendations';
}

// Evaluates the recommendations flag and renders the carousel for `variableKey`.
// Only swaps out the static section (staticId) when a valid reco model ID is configured.
// If the flag is disabled or the variable is still "none", the static section stays visible.
async function fetchFlaggedReco(variableKey, sectionId, gridId, excludeId, staticId) {
  const section = document.getElementById(sectionId);
  if (!section || !vwoClientSide) return;

  try {
    const flag = await vwoClientSide.getFlag('recommendations', { id: siteConfig.visitorId || 'anonymous' });
    const isEnabled   = flag.isEnabled();
    const recoModelId = isEnabled ? flag.getVariable(variableKey, 'none') : 'none';
    if (recoModelId === 'none') return; // leave static section visible

    // Valid reco ID — swap static section for the flagged carousel
    if (staticId) {
      const staticSec = document.getElementById(staticId);
      if (staticSec) staticSec.style.display = 'none';
    }
    section.querySelector('[data-reco-title]').textContent = getCarouselTitle(variableKey);
    section.querySelector('[data-reco-badge]').textContent = 'Wingify Commerce — Recommendations';
    section.style.display = '';

    const siteId = siteConfig.recoId || '1120';
    fetchRecoGrid(gridId, excludeId, `https://uc-info.eu.abtasty.com/v1/reco/${siteId}/recos/${recoModelId}`);
  } catch(e) {}
}

function loadRecosTag(siteId) {

  const script = document.createElement('script');

// ====== VWO CLIENT-SIDE SDK ======
let vwoClientSide = null;

async function initVwoClientSide(accountId, sdkKey) {
  return new Promise(resolve => {
    const doInit = () => {
      window.vwoSdk.init({ accountId: String(accountId), sdkKey: String(sdkKey), logger: { level: 'ERROR' } })
        .then(client => { vwoClientSide = client; resolve(client); })
        .catch(() => resolve(null));
    };
    if (window.vwoSdk) { doInit(); return; }
    const s = document.createElement('script');
    s.src = '/vwo-sdk.js';
    s.onload = doInit;
    s.onerror = () => resolve(null);
    document.head.appendChild(s);
  });
}

const gateState = { step: 'email', email: '', emailError: null, theme: '', themeError: null, accountId: '', sdkKey: '', apiKey: '', recoId: '', recoToken: '', abtId: '' };

function showGate() {
  const overlay = document.getElementById('gate-overlay');
  overlay.classList.remove('hidden');
  gateState.step = 'email';
  gateState.emailError = null;
  renderGateStep();
}

function hideGate() {
  document.getElementById('gate-overlay').classList.add('hidden');
}

function selectTheme(value) {
  gateState.theme = value;
  gateState.themeError = null;
  document.querySelectorAll('.gate-theme-card').forEach(el => {
    const input = el.querySelector('input[type=radio]');
    el.classList.toggle('selected', input && input.value === value);
  });
  fetch('/api/check-theme', {
    method: 'POST', headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ usertheme: value }),
  })
    .then(r => r.json())
    .then(data => console.log('[VWO] demoTheme flag → enabled:', data.isEnabled, '| theme:', data.theme))
    .catch(e  => console.warn('[VWO] check-theme failed:', e.message));
}

  'theme':      'email',
  'account-id': 'theme',
  'sdk-key':    'account-id',
  'api-key':    'sdk-key',
  'reco-id':    'api-key',

function gateBack() {
  const prev = GATE_BACK_MAP[gateState.step];
  if (prev) { gateState.step = prev; renderGateStep(); }
}

function renderGateStep() {
  document.getElementById('gate-content').innerHTML = buildGateHTML();
  const nb = document.getElementById('gate-next-btn');
  if (nb) nb.onclick = handleGateNext;
  const bb = document.getElementById('gate-back-btn');
  if (bb) bb.onclick = gateBack;
  const sb = document.getElementById('gate-skip-btn');
  if (sb) sb.onclick = () => { gateState.apiKey = ''; gateState.step = 'reco-id'; renderGateStep(); };
  const inp = document.querySelector('#gate-content input');
  if (inp) {
    inp.focus();
    inp.addEventListener('keydown', e => { if (e.key === 'Enter') handleGateNext(); });
  }
}

async function handleGateNext() {
  const step = gateState.step;

  if (step === 'email') {
    const el = document.getElementById('gate-email');
    const val = el.value.trim();
    if (!val || !val.includes('@')) { el.style.borderColor = 'var(--red)'; return; }
    const btn = document.getElementById('gate-next-btn');
    btn.disabled = true; btn.textContent = 'Checking…';
    try {
      const r    = await fetch('/api/verify-email', {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ email: val }),
      });
      const data = await r.json();
      if (data.approved) {
        gateState.email      = val;
        gateState.emailError = null;
        if (data.hasCredentials) {
          try {
            const cfg = await fetch(`/api/config?email=${encodeURIComponent(val)}`).then(r => r.json());
            if (cfg.hasCredentials) {
              siteConfig = cfg;
              if (cfg.recoId) {
                ABTASTY_RECO_URL   = `https://uc-info.eu.abtasty.com/v1/reco/${cfg.recoId}/recos/2de4a962-5c54-4129-9fe7-28edd06a2141`;
                ABTASTY_RECO_TOKEN = cfg.recoToken || '';
              }
              applyTheme(cfg.theme || 'canada');
              loadRecosTag(cfg.recoId || '1120');
              hideGate();
              render();
              return;
            }
          } catch(e) {}
        }
        gateState.step = 'theme';
        renderGateStep();
      } else {
        gateState.email      = val;
        gateState.emailError = 'This email is not authorised. Please contact your VWO representative.';
        renderGateStep();
      }
    } catch(e) {
      btn.disabled = false; btn.textContent = 'Continue →';
    }

  } else if (step === 'theme') {
    if (!gateState.theme) {
      gateState.themeError = 'Please select a theme to continue.';
      renderGateStep();
      return;
    }
    gateState.themeError = null;
    gateState.step = 'account-id';
    renderGateStep();

  } else if (step === 'account-id') {
    const el = document.getElementById('gate-account-id');
    const val = el.value.trim();
    if (!val) { el.style.borderColor = 'var(--red)'; return; }
    gateState.accountId = val;
    gateState.step = 'sdk-key';
    renderGateStep();

  } else if (step === 'sdk-key') {
    const el = document.getElementById('gate-sdk-key');
    const val = el.value.trim();
    if (!val) { el.style.borderColor = 'var(--red)'; return; }
    gateState.sdkKey = val;
    gateState.step = 'api-key';
    renderGateStep();

  } else if (step === 'api-key') {
    const el = document.getElementById('gate-api-key');
    const val = el.value.trim();
    if (!val) { el.style.borderColor = 'var(--red)'; return; }
    gateState.apiKey = val;
    gateState.step = 'reco-id';
    renderGateStep();

  } else if (step === 'reco-id') {
    const el = document.getElementById('gate-reco-id');
    const val = el.value.trim();
    if (!val) { el.style.borderColor = 'var(--red)'; return; }
    gateState.recoId = val;
    gateState.step = 'reco-token';
    renderGateStep();

  } else if (step === 'reco-token') {
    const el = document.getElementById('gate-reco-token');
    const val = el.value.trim();
    if (!val) { el.style.borderColor = 'var(--red)'; return; }
    gateState.recoToken = val;
    gateState.step = 'abt-id';
    renderGateStep();

  } else if (step === 'abt-id') {
    const el = document.getElementById('gate-abt-id');
    const val = el.value.trim();
    if (!val) { el.style.borderColor = 'var(--red)'; return; }
    gateState.abtId = val;
    const btn = document.getElementById('gate-next-btn');
    btn.disabled = true; btn.textContent = 'Verifying…';
    try {
      const vr = await fetch('/api/verify-email', {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ email: gateState.email }),
      });
      const vdata = await vr.json();
      if (!vdata.approved) {
        gateState.emailError = 'Access verification failed. Please re-enter your email.';
        gateState.step = 'email';
        renderGateStep();
        return;
      }
      btn.textContent = 'Saving…';
      const r = await fetch('/api/credentials', {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ email: gateState.email, accountId: gateState.accountId, sdkKey: gateState.sdkKey, apiKey: gateState.apiKey, recoId: gateState.recoId, recoToken: gateState.recoToken, abtId: gateState.abtId, theme: gateState.theme }),
      });
      if (r.ok) {
        btn.textContent = 'Setting up flags…';
        try {
          await fetch('/api/setup-flags', { method: 'POST' });
        } catch(e) {}
        btn.textContent = 'Launching…';
        siteConfig.hasCredentials = true;
        siteConfig.email          = gateState.email;
        siteConfig.accountId      = gateState.accountId;
        siteConfig.sdkKey         = gateState.sdkKey;
        siteConfig.apiKey         = gateState.apiKey;
        siteConfig.recoId         = gateState.recoId;
        siteConfig.recoToken      = gateState.recoToken;
        siteConfig.abtId          = gateState.abtId;
        siteConfig.theme          = gateState.theme;
        applyTheme(gateState.theme || 'canada');
        loadRecosTag(gateState.recoId);
        ABTASTY_RECO_URL = `https://uc-info.eu.abtasty.com/v1/reco/${gateState.recoId}/recos/2de4a962-5c54-4129-9fe7-28edd06a2141`;
        ABTASTY_RECO_TOKEN = gateState.recoToken;
        hideGate();
        render();
        return;
      }
    } catch(e) {}
    btn.disabled = false; btn.textContent = 'Save & Launch 🍁';
  }
}

function selectCredsTheme(value) {
  document.querySelectorAll('#creds-content .gate-theme-card').forEach(el => {

    el.classList.toggle('selected', input && input.value === value);
  });

function closeCredentials() {
  document.getElementById('creds-overlay').classList.add('hidden');
}

async function saveCredentials() {
  const btn = document.getElementById('creds-save-btn');
  btn.disabled = true; btn.textContent = 'Saving…';
  const selectedTheme = document.querySelector('#creds-content input[name="creds-theme"]:checked')?.value || siteConfig.theme || '';
  const accountId = document.getElementById('cred-account-id').value.trim();
  const sdkKey    = document.getElementById('cred-sdk-key').value.trim();
  const apiKey    = document.getElementById('cred-api-key').value.trim();
  const recoId    = document.getElementById('cred-reco-id').value.trim();
  const recoToken = document.getElementById('cred-reco-token').value.trim();
  const abtId     = document.getElementById('cred-abt-id').value.trim();
  try {
    const r = await fetch('/api/credentials', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ email: siteConfig.email || '', accountId, sdkKey, apiKey: apiKey || undefined, recoId, recoToken, abtId: abtId || undefined, theme: selectedTheme || undefined }),
    });
    if (r.ok) {
      siteConfig.accountId = accountId;
      siteConfig.sdkKey    = sdkKey;
      if (apiKey) siteConfig.apiKey = apiKey;
      siteConfig.recoId    = recoId;
      siteConfig.recoToken = recoToken;
      if (abtId) siteConfig.abtId = abtId;
      if (selectedTheme) {
        siteConfig.theme = selectedTheme;
        applyTheme(selectedTheme);
        fetch('/api/check-theme', {
          method: 'POST', headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ usertheme: selectedTheme }),
        })
          .then(r => r.json())
          .then(data => console.log('[VWO] demoTheme flag → enabled:', data.isEnabled, '| theme:', data.theme))
          .catch(e  => console.warn('[VWO] check-theme failed:', e.message));
      }
      ABTASTY_RECO_URL   = `https://uc-info.eu.abtasty.com/v1/reco/${recoId}/recos/2de4a962-5c54-4129-9fe7-28edd06a2141`;
      ABTASTY_RECO_TOKEN = recoToken;
      loadRecosTag(recoId);
      closeCredentials();
      render();
      return;
    }
  } catch(e) {}
  btn.disabled = false; btn.textContent = 'Save Changes';
}

async function retrySetupFlags() {
  const btn = document.getElementById('creds-setup-flags-btn');
  btn.disabled = true; btn.textContent = 'Setting up flags…';
  try {
    const r    = await fetch('/api/setup-flags', { method: 'POST' });
    const data = await r.json();
    console.log('[setup-flags]', JSON.stringify(data));
    const errors = Object.entries(data.results || {}).filter(([,v]) => v.error);
    if (errors.length) {
      alert('Some flags failed:\n' + errors.map(([k,v]) => `${k}: ${v.error}`).join('\n'));
    } else {
      btn.textContent = 'Flags ready ✓';
      setTimeout(() => { btn.disabled = false; btn.textContent = 'Re-run Flag Setup'; }, 2000);
      return;
    }
  } catch(e) {
    alert('Flag setup failed: ' + e.message);
  }
  btn.disabled = false; btn.textContent = 'Re-run Flag Setup';
}

async function resetCredentials() {
  if (!confirm('Reset all credentials? You\'ll be prompted to re-enter them on the next page load.')) return;
  await fetch('/api/credentials', { method: 'DELETE' });
  window.location.reload();
}

// ====== RENDER ENGINE ======
function render() {
  const app = document.getElementById('app');
  app.innerHTML = '';
  const wrapper = document.createElement('div');
  wrapper.className = 'page page-transition';
  wrapper.innerHTML = buildPage();
  app.appendChild(wrapper);
  bindEvents();
  _bindNavSearch();
  if (state.page !== 'search') _hideNavDropdown();
  if (state.page === 'home') fetchTrendingProducts();
  if (state.page === 'pdp')  fetchRecoGrid('pdp-reco-grid', state.currentProduct?.id);
  if (state.page === 'checkout') fetchRecoGrid('checkout-reco-grid');
  if (state.page === 'search') _doSearch();
  loadFlaggedRecos();
}

// Resolves the pricePromotion flag from the visitor's FME account.
// Returns true if state changed (caller should re-render).
async function fetchPricePromoFlag() {
  if (!vwoClientSide || !siteConfig.visitorId) return false;
  try {
    const flag    = await vwoClientSide.getFlag('pricePromotion', { id: siteConfig.visitorId });
    const enabled = flag.isEnabled();
    const raw     = enabled ? flag.getVariable('PromoBanner', false) : false;
    const banner  = raw === true || raw === 'true';
    const disc    = enabled ? (Number(flag.getVariable('discountpercent', 0)) || 0) : 0;
    const changed = banner !== _promoBannerEnabled || disc !== _promoDiscount;
    _promoBannerEnabled = banner;
    _promoDiscount      = disc;
    return changed;
  } catch(e) {
    return false;
  }
}

function buildPromoBar() {
  if (!_promoBannerEnabled || !_promoDiscount) return '';
  const msg = currentTheme === 'france'
    ? `🏷️ <strong>${_promoDiscount}% de réduction</strong> sur tout le site — remise appliquée automatiquement`
    : `🏷️ <strong>${_promoDiscount}% off</strong> sitewide — discount applied automatically`;
  return `<div class="promo-flash-bar">${msg}</div>`;
}

// Re-initialises the VWO client on every render so flag variables are always fresh.
async function loadFlaggedRecos() {
  if (!siteConfig.hasCredentials) return;
  await initVwoClientSide(siteConfig.accountId, siteConfig.sdkKey);

  // Resolve pricePromotion first — if state changed, re-render with correct prices/banner
  const promoChanged = await fetchPricePromoFlag();
  if (promoChanged) { render(); return; } // render() will call loadFlaggedRecos again; second pass promoChanged=false

  if (state.page === 'home') {
    fetchFlaggedReco('homepage_id', 'flag-reco-home', 'flag-grid-home', undefined, 'trending-section');
  }
  if (state.page === 'pdp') {
    fetchFlaggedReco('pdp_id', 'flag-reco-pdp', 'flag-grid-pdp', state.currentProduct?.id, 'pdp-reco-section');
  }
  if (state.page === 'checkout') {
    fetchFlaggedReco('cart_id', 'flag-reco-cart', 'flag-grid-cart', undefined, 'checkout-reco-section');
  }
}

function navigate(page, data = {}) {
  state.page = page;
  if (data.product) { state.currentProduct = data.product; state.selectedSize = null; state.selectedColor = data.product.colors[0]; state.qty = 1; }
  if (data.collection) state.currentCollection = data.collection;
  window.scrollTo(0, 0);
  render();
}

function buildPage() {
  const nav   = buildNav();
  const promo = buildPromoBar();
  let content = '';
  if (state.page === 'home') content = buildHome();
  else if (state.page === 'collection') content = buildCollectionPage();
  else if (state.page === 'pdp') content = buildPDP();
  else if (state.page === 'checkout') content = buildCheckout();
  else if (state.page === 'success') content = buildSuccess();
  else if (state.page === 'search') content = buildSearch();
  const footer = buildFooter();
  return nav + promo + content + footer;
}

// ====== EVENT BINDING ======
function bindEvents() {
  // Filter chips (collection page)
  document.querySelectorAll('.filter-chip').forEach(el => {
    el.onclick = () => {
      state.filterActive = el.dataset.filter;
      render();
    };
  });

  // Collection cards
  document.querySelectorAll('.coll-card').forEach((el, i) => {
    el.onclick = () => navigate('collection', { collection: COLLECTIONS[i] });
  });

  // Trending carousel nav
  const tCarousel = document.getElementById('trending-grid');
  const tPrev = document.getElementById('trending-prev');
  const tNext = document.getElementById('trending-next');
  if (tCarousel && tPrev && tNext) {
    const scrollBy = () => tCarousel.offsetWidth * 0.8;
    tPrev.onclick = () => tCarousel.scrollBy({ left: -scrollBy(), behavior: 'smooth' });
    tNext.onclick = () => tCarousel.scrollBy({ left: scrollBy(), behavior: 'smooth' });
  }

  // PDP size buttons
  document.querySelectorAll('.size-btn').forEach(el => {
    el.onclick = () => { state.selectedSize = el.dataset.size; render(); };
  });

  // PDP color swatches
  document.querySelectorAll('.color-swatch').forEach(el => {
    el.onclick = () => { state.selectedColor = el.dataset.color; render(); };
  });

  // PDP qty
  const minus = document.getElementById('qty-minus');
  const plus = document.getElementById('qty-plus');
  if (minus) minus.onclick = () => { if (state.qty > 1) { state.qty--; render(); } };
  if (plus) plus.onclick = () => { state.qty++; render(); };

  // PDP thumbnails
  document.querySelectorAll('.pdp-thumb').forEach(el => {
    el.onclick = () => {
      document.querySelectorAll('.pdp-thumb').forEach(t => t.classList.remove('active'));
      el.classList.add('active');
      const mainEmoji = document.getElementById('pdp-main-emoji');
      if (mainEmoji) mainEmoji.textContent = el.dataset.thumb;
    };
  });

  // Add to cart
  const addBtn = document.getElementById('add-to-cart');
  if (addBtn) {
    addBtn.onclick = () => {
      const p = state.currentProduct;
      if (!state.selectedSize) { alert('Please select a size'); return; }
      const existing = state.cart.find(i => i.product.id === p.id && i.size === state.selectedSize);
      if (existing) existing.qty += state.qty;
      else state.cart.push({ product: p, size: state.selectedSize, color: state.selectedColor, qty: state.qty });
      navigate('checkout');
    };
  }

  // PDP reco carousel nav
  const pdpCar = document.getElementById('pdp-reco-grid');
  const pdpPrev = document.getElementById('pdp-reco-prev');
  const pdpNext = document.getElementById('pdp-reco-next');
  if (pdpCar && pdpPrev && pdpNext) {
    const pdpScroll = () => pdpCar.offsetWidth * 0.8;
    pdpPrev.onclick = () => pdpCar.scrollBy({ left: -pdpScroll(), behavior: 'smooth' });
    pdpNext.onclick = () => pdpCar.scrollBy({ left:  pdpScroll(), behavior: 'smooth' });
  }

  // Checkout reco carousel nav
  const coCar = document.getElementById('checkout-reco-grid');
  const coPrev = document.getElementById('checkout-reco-prev');
  const coNext = document.getElementById('checkout-reco-next');
  if (coCar && coPrev && coNext) {
    const coScroll = () => coCar.offsetWidth * 0.8;
    coPrev.onclick = () => coCar.scrollBy({ left: -coScroll(), behavior: 'smooth' });
    coNext.onclick = () => coCar.scrollBy({ left:  coScroll(), behavior: 'smooth' });
  }

  // Place order
  const orderBtn = document.getElementById('place-order');
  if (orderBtn) {
    orderBtn.onclick = () => {
      state.cart = [];
      navigate('success');
    };
  }
}

function _positionDropdown() {
  const wrap = document.querySelector('.nav-search-wrap');
  const dd   = document.getElementById('nav-search-dropdown');
  if (!wrap || !dd) return;
  const r = wrap.getBoundingClientRect();
  dd.style.top   = `${r.bottom + 6}px`;
  dd.style.right = `${window.innerWidth - r.right}px`;
  dd.style.width = `${Math.max(r.width, 560)}px`;
}

function _hideNavDropdown() {
  const dd = document.getElementById('nav-search-dropdown');
  if (dd) dd.style.display = 'none';
}

function _showNavDropdown(suggestions, hits, totalHits, query) {
  const dd = document.getElementById('nav-search-dropdown');
  if (!dd || (!suggestions.length && !hits.length)) { _hideNavDropdown(); return; }

  const suggestionsHtml = suggestions.map(s => {
    const text = s.text || '';
    return `<div class="search-drop-suggestion" data-query="${_escHtml(text)}">
      <span class="search-drop-suggestion-icon">🔍</span>${_escHtml(text)}
    </div>`;
  }).join('');

  const hitsHtml = hits.map(hit => {
    const name  = hit.title || hit.name || 'Product';
    const price = hit.price != null ? `$${Number(hit.price).toFixed(0)}` : '';
    const img   = hit.img_link
      ? `<img src="${_escHtml(hit.img_link)}" style="width:40px;height:40px;object-fit:cover" loading="lazy" alt="">`
      : `<span style="font-size:22px">🛍️</span>`;
    return `<div class="search-drop-hit" data-link="${_escHtml(hit.link || '')}">
      <div class="search-drop-thumb">${img}</div>
      <div class="search-drop-name">${_escHtml(name)}</div>
      ${price ? `<div class="search-drop-price">${_escHtml(price)}</div>` : ''}
    </div>`;
  }).join('');

  const hasSuggestions = suggestions.length > 0;
  dd.innerHTML = hasSuggestions ? `
    <div class="search-drop-columns">
      <div class="search-drop-col search-drop-col-left">
        <div class="search-drop-col-header">Suggestions</div>
        ${suggestionsHtml}
      </div>
      <div class="search-drop-col">
        <div class="search-drop-col-header">Products</div>
        ${hitsHtml || '<div style="padding:12px 16px;font-size:13px;color:var(--gray)">No products found</div>'}
      </div>
    </div>
    <div class="search-drop-footer">
      <button class="search-drop-view-all" id="search-view-all-btn">View all results for "${_escHtml(query)}" →</button>
    </div>` : `
    <div>
      <div class="search-drop-col-header" style="padding:10px 16px 8px">Products</div>
      ${hitsHtml || '<div style="padding:12px 16px;font-size:13px;color:var(--gray)">No products found</div>'}
    </div>
    <div class="search-drop-footer">
      <button class="search-drop-view-all" id="search-view-all-btn">View all results for "${_escHtml(query)}" →</button>
    </div>`;
  _positionDropdown();
  dd.style.display = 'block';
  dd.querySelectorAll('.search-drop-suggestion').forEach(el => {
    el.onclick = () => { const q = el.dataset.query; if (q) { _hideNavDropdown(); _viewAllSearch(q); } };
  });
  dd.querySelectorAll('.search-drop-hit').forEach(el => {
    el.onclick = () => { const l = el.dataset.link; if (l) { _hideNavDropdown(); window.open(l, '_blank', 'noopener'); } };
  });
  document.getElementById('search-view-all-btn').onclick = () => _viewAllSearch(query);
}

function _doNavSearch(query) {
  _searchQuery = query;
  if (!query.trim()) { _hideNavDropdown(); return; }

  // Cancel any in-flight requests from the previous keystroke
  if (_navAbort) _navAbort.abort();
  _navAbort = new AbortController();
  const { signal } = _navAbort;

  _navDropSuggestions = [];
  _navDropHits        = [];
  _navDropTotalHits   = 0;

  // Suggestions — renders its column as soon as it arrives
  (async () => {
    try {
      const res = await fetch(`/api/autocomplete?text=${encodeURIComponent(query)}&hitsPerPage=5`, { signal });
      const data = res.ok ? await res.json() : {};
      _navDropSuggestions = data.suggestions || [];
      _showNavDropdown(_navDropSuggestions, _navDropHits, _navDropTotalHits, query);
    } catch(e) { if (e.name !== 'AbortError') _hideNavDropdown(); }
  })();

  // Product hits — renders its column as soon as it arrives
  (async () => {
    try {
      const res = await fetch(`${SEARCH_BASE}?text=${encodeURIComponent(query)}&hitsPerPage=3`, { signal });
      const data = res.ok ? await res.json() : {};
      if (data.noIdentifier) { _hideNavDropdown(); return; }
      _navDropHits      = data.hits      || [];
      _navDropTotalHits = data.totalHits || 0;
      _showNavDropdown(_navDropSuggestions, _navDropHits, _navDropTotalHits, query);
    } catch(e) { if (e.name !== 'AbortError') _hideNavDropdown(); }
  })();
}

function _viewAllSearch(query) {
  _searchQuery = query || _searchQuery;
  _activeFilters = {}; _priceMin = ''; _priceMax = ''; _sortBy = '';
  _currentPage = 0; _accHits = []; _lastFacets = {};
  _totalPages = 0; _totalHits = 0;
  _hideNavDropdown();
  navigate('search');
}

// Close dropdown on outside click — registered once at script load
document.addEventListener('click', e => {
  if (!e.target.closest('.nav-search-wrap') && !e.target.closest('#nav-search-dropdown')) {
    _hideNavDropdown();
  }
});

// ── Full search results page ──────────────────────────────────────────────────

function buildSearch() {
  return `
  <div class="search-page-header">
    <div class="container">
      <div class="abt-badge" style="margin-bottom:12px"><span class="dot"></span> Wingify Commerce — Search</div>
      <h1 class="search-page-query">Results for <em>"${_escHtml(_searchQuery)}"</em></h1>
    </div>
  </div>
  <div class="section">
    <div class="container">
      <div class="search-layout">
        <aside id="search-facets" class="search-sidebar" style="display:none"></aside>
        <div>
          <div id="search-controls" class="search-controls-row" style="display:none"></div>
          <div id="search-results"><div class="search-loading">Searching…</div></div>
          <div id="search-load-more-row" style="display:none;padding:32px 0;text-align:center"></div>
          <div style="padding:20px 0;border-top:1px solid var(--gray-light);text-align:right;font-size:11px;color:var(--gray);margin-top:16px">
            Powered by <strong>Wingify Commerce</strong> Search
          </div>
        </div>
      </div>
    </div>
  </div>`;
}

// Build query string exactly per API docs — bracket notation, no facets[] param
function _buildSearchParams(page) {
  const p = [
    `text=${encodeURIComponent(_searchQuery)}`,
    `hitsPerPage=12`,
    `page=${page}`,
    `semanticRatio=1`,
    `facets=*`,
  ];
  if (_sortBy) p.push(`sort=${_sortBy}`);

  // List filters: filters[field][]=v1&filters[field][]=v2
  Object.entries(_activeFilters).forEach(([field, vals]) => {
    [...vals].forEach(v => p.push(`filters[${field}][]=${encodeURIComponent(v)}`));
  });

  // Range filter for price: filters[price][0][operator]=>=&filters[price][0][value]=10
  let ri = 0;
  if (_priceMin !== '') {
    p.push(`filters[price][${ri}][operator]=%3E%3D`);
    p.push(`filters[price][${ri++}][value]=${_priceMin}`);
  }
  if (_priceMax !== '') {
    p.push(`filters[price][${ri}][operator]=%3C%3D`);
    p.push(`filters[price][${ri}][value]=${_priceMax}`);
  }

  return p.join('&');
}

async function _doSearch(query, append) {
  if (query !== undefined) _searchQuery = query;
  const resultsEl = document.getElementById('search-results');
  if (!resultsEl) return;
  if (!_searchQuery.trim()) { resultsEl.innerHTML = ''; _accHits = []; return; }
  if (!append) {
    _currentPage = 0; _accHits = [];
    resultsEl.innerHTML = '<div class="search-loading">Searching…</div>';
  } else {
    const lm = document.getElementById('search-load-more-row');
    if (lm) lm.innerHTML = '<div style="text-align:center;padding:8px;color:var(--gray);font-size:13px">Loading…</div>';
  }
  try {
    const res  = await fetch(`${SEARCH_BASE}?${_buildSearchParams(_currentPage)}`);
    if (!res.ok) throw new Error('Search API ' + res.status);
    const data = await res.json();
    if (data.noIdentifier) {
      resultsEl.innerHTML = `<div class="search-empty">${SEARCH_EMPTY_MSG}</div>`;
      return;
    }
    _totalHits  = data.totalHits  || 0;
    _totalPages = data.totalPages || 0;
    _lastFacets = data.facets || {};
    _accHits    = append ? [..._accHits, ...(data.hits || [])] : (data.hits || []);
    _renderControls();
    try { _renderFacets(); } catch(e) { console.warn('[Facets render error]', e); }
    _renderAccHits();
    _renderLoadMore();
  } catch(e) {
    console.warn('[Search error]', e);
    if (!append) resultsEl.innerHTML = `<div class="search-empty">${SEARCH_EMPTY_MSG}</div>`;
    const lm = document.getElementById('search-load-more-row');
    if (lm) lm.style.display = 'none';
  }
}

const SORT_OPTIONS = [
  { value: '',           label: 'Relevance' },
  { value: 'price:asc',  label: 'Price: Low to High' },
  { value: 'price:desc', label: 'Price: High to Low' },
  { value: 'name:asc',   label: 'Name: A–Z' },
  { value: 'name:desc',  label: 'Name: Z–A' },
];

function _renderControls() {
  const el = document.getElementById('search-controls');
  if (!el) return;
  el.style.display = 'flex';
  const activeCount = Object.keys(_activeFilters).length + (_priceMin || _priceMax ? 1 : 0);
  const clearBtn = activeCount > 0
    ? `<button id="search-clear-filters" style="font-size:12px;background:none;border:none;color:var(--red);cursor:pointer;padding:0;font-family:var(--font-body);text-decoration:underline;text-underline-offset:2px">Clear ${activeCount} filter${activeCount > 1 ? 's' : ''}</button>`
    : '';
  const sortOpts = SORT_OPTIONS.map(o =>
    `<option value="${o.value}"${_sortBy === o.value ? ' selected' : ''}>${o.label}</option>`
  ).join('');
  el.innerHTML = `
    <div style="display:flex;align-items:center;gap:10px">
      <span>${_totalHits.toLocaleString()} result${_totalHits !== 1 ? 's' : ''}</span>
      ${clearBtn}
    </div>
    <div style="display:flex;align-items:center;gap:8px">
      <label for="search-sort" style="font-size:12px;color:var(--gray);white-space:nowrap">Sort by</label>
      <select id="search-sort" style="font-size:13px;font-family:var(--font-body);border:1px solid var(--gray-light);border-radius:6px;padding:4px 8px;background:white;cursor:pointer;color:var(--black)">${sortOpts}</select>
    </div>`;
  const cfBtn = document.getElementById('search-clear-filters');
  if (cfBtn) cfBtn.onclick = () => { _activeFilters = {}; _priceMin = ''; _priceMax = ''; _doSearch(); };
  const sortSel = document.getElementById('search-sort');
  if (sortSel) sortSel.onchange = () => {
    _sortBy = sortSel.value;
    _currentPage = 0; _accHits = [];
    _doSearch();
  };
}

function _renderFacets() {
  const el     = document.getElementById('search-facets');
  const layout = document.querySelector('.search-layout');
  if (!el) return;

  const entries = Object.entries(_lastFacets);
  if (!entries.length) {
    el.style.display = 'none';
    layout?.classList.remove('has-filters');
    return;
  }

  const anyActive = Object.keys(_activeFilters).length > 0 || _priceMin !== '' || _priceMax !== '';
  const clearLink = anyActive
    ? `<button id="sidebar-clear" style="font-size:11px;background:none;border:none;color:var(--red);cursor:pointer;padding:0;font-family:var(--font-body);text-decoration:underline;text-underline-offset:2px">Clear all</button>`
    : '';

  let html = '';
  entries.forEach(([field, facet]) => {
    if (!facet) return;
    const { type, values } = facet;
    const label     = field.charAt(0).toUpperCase() + field.slice(1).replace(/_/g, ' ');
    const hasActive = field === 'price' ? (_priceMin !== '' || _priceMax !== '') : !!_activeFilters[field];
    const dot       = hasActive ? '<span style="width:6px;height:6px;background:var(--red);border-radius:50%;display:inline-block;margin-left:5px;flex-shrink:0;vertical-align:middle"></span>' : '';

    if (type === 'list' && Array.isArray(values) && values.length) {
      const chips = values.map(entry => {
        const val   = String(entry[0]);
        const count = entry[1];
        const on    = _activeFilters[field]?.has(val);
        return `<button class="search-facet-chip${on ? ' active' : ''}" data-field="${_escHtml(field)}" data-val="${_escHtml(val)}">${_escHtml(val)} <span style="opacity:0.5;font-size:11px">${count}</span></button>`;
      }).join('');
      html += `<div class="search-facet-section"><details>
        <summary><span style="display:flex;align-items:center">${_escHtml(label)}${dot}</span><span class="search-facet-chevron">▼</span></summary>
        <div class="search-facet-body">${chips}</div>
      </details></div>`;

    } else if (type === 'range' && values != null) {
      const min = values.min ?? values.Min ?? 0;
      const max = values.max ?? values.Max ?? 0;
      html += `<div class="search-facet-section"><details>
        <summary><span style="display:flex;align-items:center">${_escHtml(label)}${dot}</span><span class="search-facet-chevron">▼</span></summary>
        <div class="search-facet-body">
          <div class="search-range-inputs">
            <input id="facet-price-min" type="number" placeholder="${Math.floor(min)}" value="${_escHtml(_priceMin)}">
            <span style="color:var(--gray)">–</span>
            <input id="facet-price-max" type="number" placeholder="${Math.ceil(max)}" value="${_escHtml(_priceMax)}">
            <button class="search-range-btn" id="facet-price-go">Apply</button>
          </div>
        </div>
      </details></div>`;
    }
  });

  if (!html) { el.style.display = 'none'; layout?.classList.remove('has-filters'); return; }

  layout?.classList.add('has-filters');
  el.style.display = 'block';
  el.innerHTML = `
    <div class="search-sidebar-header">
      <span class="search-sidebar-title">Filters</span>${clearLink}
    </div>
    ${html}`;

  el.querySelector('#sidebar-clear')?.addEventListener('click', () => {
    _activeFilters = {}; _priceMin = ''; _priceMax = ''; _currentPage = 0; _accHits = []; _doSearch();
  });

  el.querySelectorAll('.search-facet-chip').forEach(chip => {
    chip.addEventListener('click', () => {
      const { field, val } = chip.dataset;
      if (!_activeFilters[field]) _activeFilters[field] = new Set();
      if (_activeFilters[field].has(val)) {
        _activeFilters[field].delete(val);
        if (!_activeFilters[field].size) delete _activeFilters[field];
      } else {
        _activeFilters[field].add(val);
      }
      _currentPage = 0; _accHits = [];
      _doSearch();
    });
  });

  const go = el.querySelector('#facet-price-go');
  if (go) {
    go.addEventListener('click', () => {
      _priceMin = el.querySelector('#facet-price-min')?.value || '';
      _priceMax = el.querySelector('#facet-price-max')?.value || '';
      _currentPage = 0; _accHits = [];
      _doSearch();
    });
    ['facet-price-min', 'facet-price-max'].forEach(id => {
      el.querySelector(`#${id}`)?.addEventListener('keydown', e => { if (e.key === 'Enter') go.click(); });
    });
  }
}

function _renderAccHits() {
  const el = document.getElementById('search-results');
  if (!el) return;
  if (!_accHits.length) { el.innerHTML = `<div class="search-empty">${SEARCH_EMPTY_MSG}</div>`; return; }
  el.innerHTML = `<div class="product-grid">${_accHits.map(hit => {
    const name  = _escHtml(hit.title || hit.name || 'Product');
    const price = hit.price != null ? `$${Number(hit.price).toFixed(0)}` : '';
    const thumb = hit.img_link
      ? `<img src="${_escHtml(hit.img_link)}" style="width:100%;height:100%;object-fit:cover" loading="lazy" alt="">`
      : `<span style="font-size:64px">🛍️</span>`;
    return `<div class="product-card search-result-card" data-link="${_escHtml(hit.link || '')}">
      <div class="product-thumb" style="background:#F4F1EA;overflow:hidden;padding:0">${thumb}</div>
      <div class="product-info">
        <div class="product-name">${name}</div>
        ${price ? `<div class="product-price-row"><span class="product-price">${_escHtml(price)}</span></div>` : ''}
      </div>
    </div>`;
  }).join('')}</div>`;
  el.querySelectorAll('.search-result-card').forEach(card => {
    card.onclick = () => { const l = card.dataset.link; if (l) window.open(l, '_blank', 'noopener'); };
  });
}

function _renderLoadMore() {
  const el = document.getElementById('search-load-more-row');
  if (!el) return;
  if (_currentPage < _totalPages - 1) {
    const rem = _totalHits - _accHits.length;
    el.style.display = 'block';
    el.innerHTML = `<button class="search-load-more-btn">Load ${Math.min(rem, 12)} more <span style="opacity:0.6">(${rem} remaining)</span></button>`;
    el.querySelector('button').onclick = () => { _currentPage++; _doSearch(undefined, true); };
  } else {
    el.style.display = 'none';
  }
}

// ── Nav input binding — re-wired by _bindNavSearch() after every render ───────
function _bindNavSearch() {
  const inp = document.getElementById('nav-search-input');
  if (!inp) return;
  inp.addEventListener('input', e => {
    clearTimeout(_navDebounce);
    _navDebounce = setTimeout(() => _doNavSearch(e.target.value), 200);
  });
  inp.addEventListener('keydown', e => {
    if (e.key === 'Enter') { clearTimeout(_navDebounce); _viewAllSearch(inp.value); }
    if (e.key === 'Escape') _hideNavDropdown();
  });
  inp.addEventListener('focus', () => {
    if (_searchQuery && document.getElementById('nav-search-dropdown')?.children.length) {
      _positionDropdown();
      document.getElementById('nav-search-dropdown').style.display = 'block';
    }
  });
}

// ====== BOOT ======
async function boot() {
  try {
    siteConfig = await fetch('/api/config').then(r => r.json());
  } catch(e) {
    siteConfig = { hasCredentials: false };
  }

  if (siteConfig.hasCredentials) {
    // Returning visitor with credentials — apply stored theme and render immediately
    if (siteConfig.recoId) {
      ABTASTY_RECO_URL   = `https://uc-info.eu.abtasty.com/v1/reco/${siteConfig.recoId}/recos/2de4a962-5c54-4129-9fe7-28edd06a2141`;
      ABTASTY_RECO_TOKEN = siteConfig.recoToken || '';
    }
    applyTheme(siteConfig.theme || 'canada');
    loadRecosTag(siteConfig.recoId || '1120');
    render();
  } else {
    // No credentials — show gate over a neutral blank page (no themed content rendered)
    showGate();
  }
}

boot();
</script>
